name: Deploy Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      TILE_DB_PATH: output/aggregates.duckdb
      DUCKDB_RELEASE_URL: ${{ vars.DUCKDB_RELEASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python project
        run: pip install -e .

      - name: Download DuckDB from release (default)
        if: env.DUCKDB_RELEASE_URL != ''
        run: |
          mkdir -p output
          curl -L "$DUCKDB_RELEASE_URL" -o "$TILE_DB_PATH"

      - name: Pull LFS objects (optional)
        if: env.DUCKDB_RELEASE_URL == ''
        run: |
          git lfs pull
          test -f "$TILE_DB_PATH"

      - name: Build static data
        run: |
          printf '%s\n' "${{ secrets.OPENAIP_API_KEY }}" > .openaip-api-key
          adsb-vfr build-tiles --input "$TILE_DB_PATH" --output-dir web/public/data

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install and build web app
        working-directory: web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm install
          npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
